{% extends "base.html" %}{% block content %}<section class="auth"><p class="eyebrow">ALQATERA HESABI</p><h1>{{'Hesab yarat' if mode=='register' else 'Xoş gəlmisən'}}</h1><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}">{% if mode=='register' %}<input name="name" placeholder="Ad və soyad" required>{% endif %}<input type="email" name="email" placeholder="Gmail və ya e-poçt" required><input type="password" name="password" placeholder="Şifrə (ən azı 10 simvol)" required><button class="primary full">{{'Qeydiyyatdan keç' if mode=='register' else 'Daxil ol'}}</button></form><p>{% if mode=='register' %}Hesabın var? <a href="/login">Daxil ol</a>{% else %}Hesabın yoxdur? <a href="/register">Qeydiyyat</a>{% endif %}</p></section>{% endblock %}
